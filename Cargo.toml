# Macast for Rust — cargo workspace.
#
# Layering (mirrors the Python package layout; each crate is one migration
# surface so a port can be verified without the others compiling):
#
#   macast-core     settings (BOM-tolerant load + corrupt quarantine), interface
#                   selection + advertisability rules, proxy-stripped player env,
#                   rotating per-module logs, tokens, trash, time formatting
#   macast-mpv      mpv argv builder + JSON IPC renderer (the player half)
#   macast-upnp     SSDP + DLNA MediaRenderer (description/SOAP/GENA/DIDL)
#   macast-cast     Chromecast Cast v2 receiver (protobuf over TLS), AirPlay RTSP,
#                   the web-address resolve/relay layers and the device send +
#                   discovery tables. **AirPlay is a module here, not a crate** —
#                   the port decided that, and the setup HTTP/8443 face is still
#                   ahead of it (see `macast-cast/src/lib.rs`'s `*(next)*` list).
#   src-tauri       tray + settings window; the only crate that knows about UI
#
# `src-tauri` stays a member so `cargo check` at the root proves the shell
# against the same lockfile the core crates use.
#
# A member that does not exist on disk yet is not a "planned crate" to cargo —
# it is a manifest load error, and that error kills *every* crate in the tree,
# including the one being worked on. So the list below is exactly the set of
# directories that exist, and each migration step adds its own member in the
# commit that writes its `Cargo.toml`. Nothing here is a promise.
[workspace]
members = [
    "macast-core",
    "macast-mpv",
    "macast-upnp",
    "macast-cast",
    "macast-frontend",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/pingod/Macast"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` is not a nicety: `LIVE_LOAD_OPTIONS` is a Python dict, so its
# insertion order *is* the order those keys reach mpv in, and the log lines that
# quote a decoded reply (`logger.info(res)`) print dict keys in the order the
# server sent them. A BTreeMap-backed Map silently re-sorts both.
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
getrandom = "0.2"
quick-xml = "0.42"
# socket2 is what lets the SSDP receiver set its options **before** binding
# UDP/1900 (`std::net` only hands you a socket by binding it), plus a `recv_from`
# that fills an uninitialized buffer — see `macast-upnp/Cargo.toml`. It is already
# in this graph at 0.6.5 through `tokio` and
# `hyper-util` (Cargo.lock:1303 and :3394, one package row at :2850). Naming an
# older socket2 would put a *second* copy of the same library in the tree to buy
# one setsockopt, which is the mistake the windows-sys pin below exists to avoid.
socket2 = "0.6.5"
# Windows bindings for `macast-mpv`'s named-pipe transport. Pinned to **0.61**
# because that is what this workspace already builds: `Cargo.lock` carries
# 0.61.2 for ten packages on the src-tauri side (dbus, dirs-sys, mio, muda,
# softbuffer, socket2, tokio, tray-icon, winapi-util, window-vibrancy), while
# 0.59.0 is reachable only through `winreg` and 0.45.0 only through `jni`.
# Naming a version nobody else asks for would add a *second* copy of the same
# bindings to the graph for no reason.
windows-sys = "0.61"
# TLS for the Cast receiver: the listener is plaintext and each connection is
# wrapped, exactly as in Python (AGENTS.md §4.1 — an ssl error on one connection
# must never take the accept loop down).
#
# `default-features = false` is the load-bearing half of this line. rustls 0.23's
# default crypto provider is `aws-lc-rs`, which builds a C library and therefore
# needs CMake plus a C toolchain on **every** machine that compiles Macast,
# including a plain `cargo test` on a laptop. `ring` compiles here in 5.49 s and
# is the provider `rcgen` already uses by default, so the two agree and no second
# provider enters the graph. `tls12` stays on: a Chromecast sender offers
# TLS 1.2, and dropping it would make the receiver undiscoverable-broken rather
# than merely slower. Nothing else in `Cargo.lock` asked for rustls at all, so
# this choice is not a feature *unification* — it is the only opinion in the graph.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pemfile = "2"
rcgen = "0.13"
log = "0.4"
rand = "0.8"
url = "2"
regex = "1"
# Fetching the pasted page is the one place the receiver speaks HTTP as a *client*
# (`media_resolve._fetch_page()`): a browser-shaped `User-Agent`, a 15 s timeout,
# `read(PAGE_MAX_BYTES)` and "any 4xx/5xx means no page". ureq's defaults are
# already that shape — `http_status_as_error: true` turns 4xx/5xx into `Err`, which
# is Python's `HTTPError`, and `max_redirects: 10` is urllib's `max_redirections`
# — and the per-request timeouts (`timeout_connect/recv_response/recv_body`) get the
# same number as Python's `urlopen(timeout=…)`, set on the request rather than the
# agent so the fetch seam stays a pure function of its arguments.
#
# `default-features = false, features = ["rustls"]` keeps the crypto story of this
# workspace intact: that feature is `rustls-no-provider` + `rustls?/ring` +
# `webpki-roots`, so the provider is the same `ring` pinned above and no `aws-lc-rs`
# /CMake can enter the graph (see the rustls note; CMake must not appear on a
# `cargo test` machine). gzip/brotli stay **off** on purpose: Python's urllib sends
# no `Accept-Encoding` either, and a server answering a request *we* spelled
# differently is a difference nobody can see. The `charset` feature stays off too —
# `decode_body` mirrors `get_content_charset()` plus the `(charset, 'utf-8', 'gbk')`
# chain by hand, so the parse happens where its fallbacks live (see `resolve.rs`).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# `decode_body`'s charset tables are **not** a dependency. The first shape tried was
# `encoding_rs` (`Encoding::for_label` ↔ `codecs.lookup`, and its strict decoder is
# Python's `UnicodeDecodeError`), and it was measured against CPython rather than
# assumed: replaying every lead/trail cell of the four double-byte families through
# it diverges from what `bytes.decode` actually returns — big5 5,144 cells, shift_jis
# 2,795, cp932 841, gb18030 21, out of 32,386 cells per family. A wrong cell is not
# an error on the cast card, it is silent mojibake in a title, so the tables live in
# `macast-cast/src/{gbk,cjk}.rs` instead, generated from this interpreter and
# re-measured over 505,120 worded rows (all five families: 0 divergent). `std`'s own
# `str::from_utf8` still covers utf-8, and the single-byte labels are hand tables
# because their whole alphabet is 256 cells. See `resolve.rs` for the chain.
# `media_resolve.py` reaches for `re` in three places whose answer is a *match*,
# not a parse: the refused-status matcher (`\b(?:40[134]|410)\b`, word boundaries
# doing the work that `str::contains` would get wrong by matching inside "4010"),
# the share-text sweep that pulls a URL out of a phone's copied sentence (with the
# full-width punctuation class that ends the match), and the " (12)" page-entry
# suffix. `LazyLock` keeps each pattern compiled once, as Python does at import.

macast-core = { path = "macast-core" }
macast-mpv = { path = "macast-mpv" }
macast-upnp = { path = "macast-upnp" }
macast-cast = { path = "macast-cast" }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
