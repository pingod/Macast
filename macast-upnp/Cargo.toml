[package]
name = "macast-upnp"
description = "SSDP announcement and the DLNA MediaRenderer face (description, SCPD, SOAP, GENA) for the Rust Macast receiver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
macast-core = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true }
# `socket2` is here because of the *order* Python's SSDP receiver uses: create the
# socket, set `SO_REUSE*`, only **then** bind UDP/1900. `std::net::UdpSocket`
# cannot do that — binding is how you get a socket — so the options that decide
# the bind would have to be applied after the port was already taken, which is
# exactly when `SO_REUSEADDR`/`SO_REUSEPORT` stop mattering. It also gives the
# receiver a `recv_from` that fills an uninitialized buffer, which is the shape
# `ssdp.py`'s `recvfrom(1024)` has. `SO_REUSEPORT` itself goes through `libc`
# (the setter on `socket2` sits behind `features = ["all"]`), so this is not a
# "one call" dependency and the `libc` line below is not decoration either.
socket2 = { workspace = true }

# Two `setsockopt` calls that `socket2` cannot make for us. `IP_MULTICAST_IF` is
# the one SSDP setting that is *not* the same call on every platform. On Darwin
# and the BSDs the kernel wants the **interface index**
# (Python: `struct.pack('!I', index)` after `fcntl.if_nametoindex`), while Linux
# accepts the index *or* the address and Windows accepts only the address form.
# `socket2` exposes only the address form, so the index route goes to the
# operating system directly and `inet_aton` stays as Linux's fallback — see
# `src/sock.rs`, which documents which half of that has never been *run* on
# Windows.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
