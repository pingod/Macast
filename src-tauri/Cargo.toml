[package]
name = "macast-tauri"
version = "0.1.0"
edition = "2021"
description = "Rust/Tauri reimplementation of Macast"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
# The two crates this shell is the `Host` for: settings/logging/paths come from
# `macast-core`, and `macast-mpv`'s `player::Host` trait is the seam implemented
# in `src/host.rs`. Before this line the crate knew nothing about either, so the
# only implementation of that trait in the tree was its own test doubles.
macast-core = { workspace = true }
macast-mpv = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
