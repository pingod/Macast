# Copyright (c) 2021 by xfangfang. All Rights Reserved.
# Apple Silicon (arm64) build pipeline + cross-platform CI,
# maintained by the Macast fork.
#
# Builds the following artefacts, one per job (four platforms):
#   - macOS arm64      .app         (macos-14 runner, py2app)
#   - Linux x86_64     .tar.gz      (ubuntu-22.04 runner, pyinstaller)
#   - Linux arm64      .tar.gz      (ubuntu-22.04-arm runner, pyinstaller)
#   - Windows x86_64   .zip         (windows-2022 runner, pyinstaller)
#
# macOS x86_64 is intentionally not built (commit f8b3a15). The macos-13 Intel
# runner queue sat at 30+ minutes, and Intel Macs are no longer a target for
# this fork. `scripts/setup_py2app.py` still honours MACAST_ARCH=x86_64, so an
# Intel build can be produced locally; `git show f8b3a15^:.github/workflows/
# build.yml` has the job block if it ever needs to come back. This header used
# to keep claiming the job existed, which is worse than an omission: it reads
# as "Intel is covered" to anyone who trusts it instead of the job list.
#
# Windows arm64 is intentionally not built: GitHub does not provide an
# arm64 Windows runner, and the project still bundles lxml + rumps which
# only ship x86_64 wheels on PyPI. Skip on tag-only releases.
#
# Triggers:
#   - push to main                     (build + upload artefacts, no release)
#   - pull_request                     (build only, no upload)
#   - workflow_dispatch (release=true) (build + GitHub release with all artefacts)
#   - push of a v*.* tag               (build + GitHub release)
#
# Manual release:   GitHub UI -> Actions -> Build Macast -> Run workflow -> release=true
#
# Artefact retention is 2 days, not the action's default: the release job
# downloads everything from the same run, so retention only serves manual
# "download that build again" clicks. Four platforms are ~170 MB per run and
# this repo's free plan caps Actions storage at 500 MB, so a 14-day window
# lets a busy fortnight wedge every later upload with
# "Artifact storage quota has been hit" -- which is what happened on
# 2026-09-21, when 193 artefacts had piled up to 8.2 GB. Note this only
# slows that drift: it is not a fix if main keeps being pushed many times a
# day. Release downloads are unaffected either way -- they live under
# GitHub Releases, which is a different bucket from Actions artefacts.

name: Build Macast

# Pin every job to Node 24 — GitHub announced 2025-09-19 that
# Node 20 is deprecated on the runners. New major versions of
# actions/checkout, actions/setup-python, actions/upload-artifact,
# actions/download-artifact and softprops/action-gh-release all
# default to Node 24 and this is the cleanest way to silence
# the warning without bouncing major versions again later.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE: '24'

on:
  push:
    branches: [main]
    tags: ['v*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Push a GitHub release with the built artefacts'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # needed for the release job to create tags/releases

# Cancel in-flight runs of the same workflow on the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # macOS arm64 — Apple Silicon .app (the primary artefact for M1+ users)
  # -----------------------------------------------------------------------
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          # `zeroconf` is not optional: macast/discovery.py imports it at module
          # level for the Chromecast/AirPlay mDNS advertisement. Without it in
          # the build environment py2app cannot see the import, the dependency
          # is silently left out of the bundle, and the shipped .app dies at
          # launch with "ModuleNotFoundError: No module named 'zeroconf'".
          pip install 'rumps' 'py2app>=0.28' 'cherrypy>=18,<19' \
                      'lxml' 'netifaces' 'appdirs' 'pyperclip' \
                      'requests' 'pillow' 'zeroconf' \
                      'pyobjc-framework-Cocoa'

      # No mpv is bundled. Playback uses the mpv already on the machine
      # (`brew install mpv`), which is what the source repo's README asks for
      # on macOS. Homebrew's mpv *cannot* be copied into a .app anyway: it
      # links against absolute /opt/homebrew/opt/* paths, so py2app rewrites
      # each of its ~14 dylibs, drags them into Contents/Frameworks (≈53 MB)
      # and the resulting binary still fails to launch.
      #
      # To ship a self-contained player instead, point MACAST_BUNDLE_MPV at a
      # portable build (upstream uses laboratory.stolendata.net's mpv_osx
      # tarball); setup_py2app.py verifies with `otool -L` that it only links
      # system libraries before copying it to Resources/bin/MacOS/mpv.
      - name: Build .app
        run: MACAST_ARCH=arm64 python scripts/setup_py2app.py py2app

      - name: Verify arm64 and i18n
        # `setup_py2app.py` compiles i18n/*/LC_MESSAGES/*.po itself (pure
        # Python), so no gettext install is required. Assert both the arch and
        # that the catalogues made it into the bundle: without the .mo files
        # gettext silently falls back to English and the release ships an
        # untranslated app.
        run: |
          file dist/Macast.app/Contents/MacOS/Macast | grep -q arm64
          file dist/Macast.app/Contents/Frameworks/Python.framework/Versions/3.12/Python | grep -q arm64
          ls dist/Macast.app/Contents/Resources/i18n/*/LC_MESSAGES/macast.mo
          find dist/Macast.app/Contents/Resources/i18n -name '*.mo' | wc -l

      - name: Report bundle composition
        # Bundle size is a feature here — a stray Homebrew mpv copy once made
        # it 102 MB — so keep the composition visible in every run, not just
        # the total. The interpreter build and the resolved dependency versions
        # both change what py2app pulls in, so log those as well; a size jump
        # between two runs is otherwise impossible to attribute.
        run: |
          python -c "import sys; print('interpreter:', sys.version)"
          echo "--- resolved dependency versions ---"
          python -m pip list --format=freeze \
            | grep -iE '^(py2app|pyobjc|lxml|rumps|cherrypy|cheroot|netifaces|appdirs|pyperclip|requests|pillow)=' \
            || true
          echo "--- bundle composition ---"
          du -sh dist/Macast.app
          du -sh dist/Macast.app/Contents/Frameworks
          du -sh dist/Macast.app/Contents/Frameworks/Python.framework
          du -sh dist/Macast.app/Contents/Resources/lib/python312.zip
          du -sh dist/Macast.app/Contents/Resources/lib/python3.12/lib-dynload

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(cat macast/.version)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Force version into the bundle Info.plist
        # py2app 0.28 builds `CFBundleVersion` / `CFBundleShortVersionString`
        # from the build-time version and then resets them to empty strings in
        # the bundled Info.plist. We rewrite them here using `plutil` so the
        # version is correct in Finder → Get Info and the AppleScript `version`
        # property. We do this regardless of where the string came from, so a
        # future py2app upgrade can move the key around without breaking us.
        run: |
          VERSION=${{ steps.version.outputs.version }}
          plutil -replace CFBundleShortVersionString -string "${VERSION}" \
            dist/Macast.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "${VERSION}" \
            dist/Macast.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/Macast.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion"          dist/Macast.app/Contents/Info.plist

      - name: Re-sign the bundle ad-hoc
        # `codesign -v` on the packaged app fails with "a sealed resource is
        # missing or invalid". Two reasons, both of them ours:
        #   - py2app signs the bundle, but its own _CodeSignature/CodeResources
        #     lists files it strips afterwards (cherrypy's test/tutorial
        #     modules, __pycache__ entries) -- 146 of them in v0.7.9;
        #   - the plutil step above then rewrites Info.plist.
        # This is worse than shipping no signature: with a broken seal
        # Gatekeeper says "Macast.app is damaged and can't be opened" instead
        # of offering the usual "Open Anyway" escape hatch. Re-seal ad-hoc as
        # the LAST mutation of the bundle so the signature matches what we
        # actually ship. Verified locally: the seal goes from
        # "a sealed resource is missing or invalid" to
        # "valid on disk / satisfies its Designated Requirement".
        run: codesign --force --sign - dist/Macast.app

      - name: Package as DMG-ready .zip
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cd dist
          # -y is required: without it `zip` FOLLOWS symlinks and stores their
          # targets as full copies. Python.framework relies on two symlinks —
          # Versions/Current -> 3.12 and Python.framework/Python -> the real
          # binary — so omitting -y duplicated a 13 MB framework directory in
          # every release, took the .app from ~41 MB to ~80 MB, and (worse)
          # left the framework with no Versions/Current symlink, which makes
          # `codesign -v` fail with "bundle format is ambiguous".
          zip -r -y "../Macast-MacOS-arm64-v${VERSION}.zip" Macast.app
          cd ..

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: Macast-MacOS-arm64-*.zip
          if-no-files-found: error
          retention-days: 2

  # -----------------------------------------------------------------------
  # macOS x86_64 (Intel Mac) was dropped: the GitHub-hosted macos-13 Intel
  # runner queue is consistently 30+ minutes long and Intel Macs are no
  # longer a target for the project. Re-add the job block from git history
  # if you ever need it back.
  # -----------------------------------------------------------------------


  # Linux x86_64 — headless CLI, packaged as a standalone binary
  # -----------------------------------------------------------------------
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext binutils

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller 'cherrypy>=18,<19' lxml netifaces \
                              appdirs pyperclip requests pillow zeroconf

      - name: Compile .po -> .mo
        run: |
          for d in i18n/*/; do
            msgfmt -o "${d}LC_MESSAGES/macast.mo" "${d}LC_MESSAGES/macast.po"
          done

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name macast \
            --add-data "i18n:i18n" \
            --add-data "macast/assets:macast/assets" \
            --add-data "macast/plugins:macast/plugins" \
            --add-data "macast/xml:macast/xml" \
            --collect-all cherrypy \
            --collect-all lxml \
            --collect-all zeroconf \
            --hidden-import=netifaces \
            --hidden-import=appdirs \
            --hidden-import=pyperclip \
            --hidden-import=macast.macast \
            --hidden-import=macast_renderer.mpv \
            --hidden-import=macast.plugins.renderer.cast_bridge \
            --hidden-import=macast.plugins.renderer.cast_local_file \
            --hidden-import=macast.plugins.renderer.external_player \
            --hidden-import=macast.plugins.renderer.floating \
            --hidden-import=macast.plugins.renderer.hooks \
            --hidden-import=macast.plugins.renderer.macast_ytdlp \
            --hidden-import=macast.plugins.renderer.screen_mirror \
            --hidden-import=macast.plugins.protocol.airplay_mirror \
            --hidden-import=macast.plugins.protocol.raop \
            --hidden-import=macast.plugins.renderer.iina \
            --hidden-import=macast.plugins.renderer.web \
            --hidden-import=macast.plugins.renderer.live \
            --hidden-import=macast.plugins.renderer.potplayer \
            --hidden-import=macast.plugins.renderer.pi_fm \
            --hidden-import=macast.plugins.protocol.nirvana \
            Macast.py

      - name: Verify x86_64
        run: file dist/macast | grep -q 'x86-64'

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(cat macast/.version)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p release
          cp dist/macast "release/macast-linux-x86_64-v${VERSION}"
          cp README.md "release/README.md"
          cp LICENSE "release/LICENSE"
          cd release
          tar czf "../Macast-Linux-x86_64-v${VERSION}.tar.gz" *
          cd ..

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: Macast-Linux-x86_64-*.tar.gz
          if-no-files-found: error
          retention-days: 2

  # -----------------------------------------------------------------------
  # Linux arm64 — same as x86_64 but for aarch64 boxes
  # -----------------------------------------------------------------------
  build-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext binutils

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller 'cherrypy>=18,<19' lxml netifaces \
                              appdirs pyperclip requests pillow zeroconf

      - name: Compile .po -> .mo
        run: |
          for d in i18n/*/; do
            msgfmt -o "${d}LC_MESSAGES/macast.mo" "${d}LC_MESSAGES/macast.po"
          done

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name macast \
            --add-data "i18n:i18n" \
            --add-data "macast/assets:macast/assets" \
            --add-data "macast/plugins:macast/plugins" \
            --add-data "macast/xml:macast/xml" \
            --collect-all cherrypy \
            --collect-all lxml \
            --collect-all zeroconf \
            --hidden-import=netifaces \
            --hidden-import=appdirs \
            --hidden-import=pyperclip \
            --hidden-import=macast.macast \
            --hidden-import=macast_renderer.mpv \
            --hidden-import=macast.plugins.renderer.cast_bridge \
            --hidden-import=macast.plugins.renderer.cast_local_file \
            --hidden-import=macast.plugins.renderer.external_player \
            --hidden-import=macast.plugins.renderer.floating \
            --hidden-import=macast.plugins.renderer.hooks \
            --hidden-import=macast.plugins.renderer.macast_ytdlp \
            --hidden-import=macast.plugins.renderer.screen_mirror \
            --hidden-import=macast.plugins.protocol.airplay_mirror \
            --hidden-import=macast.plugins.protocol.raop \
            --hidden-import=macast.plugins.renderer.iina \
            --hidden-import=macast.plugins.renderer.web \
            --hidden-import=macast.plugins.renderer.live \
            --hidden-import=macast.plugins.renderer.potplayer \
            --hidden-import=macast.plugins.renderer.pi_fm \
            --hidden-import=macast.plugins.protocol.nirvana \
            Macast.py

      - name: Verify aarch64
        run: file dist/macast | grep -q 'aarch64\|ARM aarch64'

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(cat macast/.version)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p release
          cp dist/macast "release/macast-linux-arm64-v${VERSION}"
          cp README.md "release/README.md"
          cp LICENSE "release/LICENSE"
          cd release
          tar czf "../Macast-Linux-arm64-v${VERSION}.tar.gz" *
          cd ..

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: Macast-Linux-arm64-*.tar.gz
          if-no-files-found: error
          retention-days: 2

  # -----------------------------------------------------------------------
  # Windows x86_64 — standalone .exe
  # -----------------------------------------------------------------------
  build-windows-x86_64:
    name: Windows x86_64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray 'cherrypy>=18,<19' lxml netifaces \
                              appdirs pyperclip requests pillow zeroconf

      - name: Install static gettext (msgfmt)
        # Windows runners don't ship gettext; the GitHub release of the
        # project's own gettext zip from the upstream Macast releases
        # contains a static msgfmt.exe that runs without installation.
        shell: bash
        run: |
          curl -sL -o gettext.zip \
            "https://github.com/xfangfang/Macast/releases/download/v0.1/gettext0.21-iconv1.16-static-64.zip"
          7z x -ogettext gettext.zip bin/msgfmt.exe
          echo "D:/a/$(basename $GITHUB_REPOSITORY)/$(basename $GITHUB_REPOSITORY)/gettext/bin" >> $GITHUB_PATH

      - name: Compile .po -> .mo
        shell: bash
        run: |
          for d in i18n/*/; do
            msgfmt -o "${d}LC_MESSAGES/macast.mo" "${d}LC_MESSAGES/macast.po"
          done

      - name: Fetch portable mpv playback engine
        # Macast plays DLNA media via mpv; Windows has no mpv by default so we
        # bundle a static x86_64 build next to the exe (-> bin/mpv.exe).
        shell: bash
        run: |
          mkdir -p bin
          curl -sL -o mpv.7z \
            "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260903/mpv-x86_64-20260903-git-69e63f425a.7z"
          7z x -y -obin mpv.7z
          # keep only the player binary + its assets; drop docs/installer/bats
          rm -rf bin/doc bin/installer bin/*.bat bin/mpv.com mpv.7z
          ls -la bin/

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --name macast.exe \
            --add-data "i18n;i18n" \
            --add-data "macast/assets;macast/assets" \
            --add-data "macast/plugins;macast/plugins" \
            --add-data "macast/xml;macast/xml" \
            --add-binary "bin;bin" \
            --collect-all cherrypy \
            --collect-all lxml \
            --collect-all zeroconf \
            --hidden-import=netifaces \
            --hidden-import=appdirs \
            --hidden-import=pyperclip \
            --hidden-import=macast.macast \
            --hidden-import=macast_renderer.mpv \
            --hidden-import=macast.plugins.renderer.cast_bridge \
            --hidden-import=macast.plugins.renderer.cast_local_file \
            --hidden-import=macast.plugins.renderer.external_player \
            --hidden-import=macast.plugins.renderer.floating \
            --hidden-import=macast.plugins.renderer.hooks \
            --hidden-import=macast.plugins.renderer.macast_ytdlp \
            --hidden-import=macast.plugins.renderer.screen_mirror \
            --hidden-import=macast.plugins.protocol.airplay_mirror \
            --hidden-import=macast.plugins.protocol.raop \
            --hidden-import=macast.plugins.renderer.iina \
            --hidden-import=macast.plugins.renderer.web \
            --hidden-import=macast.plugins.renderer.live \
            --hidden-import=macast.plugins.renderer.potplayer \
            --hidden-import=macast.plugins.renderer.pi_fm \
            --hidden-import=macast.plugins.protocol.nirvana \
            Macast.py

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(cat macast/.version)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Package
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p release
          cp dist/macast.exe "release/macast-windows-x86_64-v${VERSION}.exe"
          cp README.md "release/README.md"
          cp LICENSE "release/LICENSE"
          cd release
          7z a "../Macast-Windows-x86_64-v${VERSION}.zip" *
          cd ..

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: Macast-Windows-x86_64-*.zip
          if-no-files-found: error
          retention-days: 2

  # -----------------------------------------------------------------------
  # Release — collect artefacts and create a GitHub release.
  # Only runs on tag push, on release-true manual dispatch, or on tag push.
  # -----------------------------------------------------------------------
  release:
    name: GitHub Release
    needs:
      - build-macos-arm64
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows-x86_64
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release == true)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        # Needed for `macast/.version`: this job only downloads build
        # artefacts otherwise, and resolving the version without a checkout
        # fails on a manual (workflow_dispatch) release run.
        uses: actions/checkout@v6

      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          path: artefacts

      - name: List artefacts
        run: ls -R artefacts/

      - name: Verify version sources agree
        # Three places name the release: `macast/.version` (setup.py),
        # `macast/_version.py` (pyproject's dynamic version) and the git tag.
        # Drift between them ships an artefact whose pip metadata disagrees
        # with its own filename, so refuse to publish instead.
        run: |
          set -eu
          DOT=$(cat macast/.version)
          PY=$(sed -n 's/^__version__[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' macast/_version.py)
          echo "macast/.version    = ${DOT}"
          echo "macast/_version.py = ${PY}"
          if [ "${DOT}" != "${PY}" ]; then
            echo "ERROR: version sources disagree (${DOT} vs ${PY})" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "release tag        = ${TAG}"
            if [ "${TAG}" != "${DOT}" ]; then
              echo "ERROR: tag v${TAG} does not match macast/.version ${DOT}" >&2
              exit 1
            fi
          fi

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(cat macast/.version)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Macast v${{ steps.version.outputs.version }}
          body: |
            Built by GitHub Actions. See `BUILDING.md` in the repo for
            instructions on how to verify and use the artefacts.

            Artefacts (this release: **v${{ steps.version.outputs.version }}**):
            - `Macast-MacOS-arm64-v${{ steps.version.outputs.version }}.zip` — Apple Silicon (M1+)
            - `Macast-Linux-x86_64-v${{ steps.version.outputs.version }}.tar.gz` — Linux x86_64
            - `Macast-Linux-arm64-v${{ steps.version.outputs.version }}.tar.gz` — Linux aarch64
            - `Macast-Windows-x86_64-v${{ steps.version.outputs.version }}.zip` — Windows x86_64
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artefacts/**/*.zip
            artefacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
